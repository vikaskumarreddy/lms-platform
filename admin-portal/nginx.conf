# Determine document root based on host domain:
# - app.axisoraforge.in or app-<slug>.axisoraforge.in -> Flutter Student Web App (/usr/share/nginx/flutter-web)
# - axisoraforge.in, admin.axisoraforge.in, or <slug>.axisoraforge.in -> Admin / Platform Portal (/usr/share/nginx/html)
map $host $app_root {
    default /usr/share/nginx/html;
    ~^app[\.\-] /usr/share/nginx/flutter-web;
}

# HTTP server: ACME challenge and 301 redirect to HTTPS
server {
    listen 80;
    server_name axisoraforge.in www.axisoraforge.in *.axisoraforge.in _;

    # Let's Encrypt / Certbot renewal ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (Serving both Platform/Admin Portal and Flutter Student App based on domain)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name axisoraforge.in www.axisoraforge.in *.axisoraforge.in _;

    ssl_certificate /etc/letsencrypt/live/axisoraforge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axisoraforge.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root $app_root;
    index index.html;

    # Headroom for video/PDF uploads
    client_max_body_size 500M;

    # Gzip Compression for superfast page loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Proxy all API traffic to the backend service
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        client_max_body_size 500M;
        proxy_hide_header X-Frame-Options;
    }

    # Uploads (logos, media, documents) passthrough to backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Swagger / API docs / actuator passthrough
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # pdf.js worker and module MIME type
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Flutter Web entrypoints & dynamic bundles: NEVER cache with immutable
    location ~* (main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|manifest\.json|version\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache static assets (wasm, fonts, images, hashed bundles)
    location ~* \.(?:wasm|js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html no-cache so app updates reflect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # History-fallback routing for both Angular SPA and Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
