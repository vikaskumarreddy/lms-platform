server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx defaults to a 1MB request body limit, which silently 413s any real
    # video/PDF upload before it ever reaches Spring Boot. Media & Files uploads
    # (raw, pre-compression) need real headroom — keep this in sync with
    # spring.servlet.multipart.max-request-size in application.yml.
    client_max_body_size 500M;

    # Proxy all API traffic to the backend service (docker-compose network name "backend").
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large video uploads over slower connections need longer than the
        # 60s nginx default, or the proxy aborts mid-upload.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;
    }

    # Swagger / API docs / actuator passthrough
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # pdf.js loads its worker as an ES module (import.meta / import()), which
    # requires the correct JS MIME type — nginx's default mime.types has no
    # entry for .mjs, so it falls back to application/octet-stream and the
    # browser refuses to execute it ("Strict MIME type checking"). This must
    # come BEFORE the generic hashed-assets block below since nginx uses the
    # first matching regex location for a given request.
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hashed build assets (main.<hash>.js, styles.<hash>.css, etc.) are safe to cache
    # forever since a new build always gets a new filename.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be served stale, or the browser keeps loading a
    # deleted-on-rebuild hashed bundle (main.<old-hash>.js) after every deploy,
    # which fails to load and leaves the SPA unable to boot (blank page, no menu).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular SPA with history-fallback routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
