name: lms_student_app
description: Axisora Forge Academy - Student Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.15
  google_fonts: ^6.1.0
  flutter_local_notifications: ^17.0.0
  connectivity_plus: ^7.3.1
  intl: ^0.19.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.2
  cached_network_image: ^3.3.1
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/