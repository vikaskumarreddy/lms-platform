services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lms_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms
      SPRING_DATASOURCE_USERNAME: lms
      SPRING_DATASOURCE_PASSWORD: lms123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://axisoraforge.in,https://*.axisoraforge.in,http://axisoraforge.in}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://axisoraforge.in}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-axisora-lms-media}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIA4YEATDV5BT4U5QFV}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-true}
    volumes:
      # Media/PDF/Doc controllers write to ./uploads/* (relative to the
      # container's /app working dir). Without a persistent volume that
      # directory lives only in the container's writable layer, so every
      # rebuild/redeploy silently wipes every uploaded file while the DB
      # rows (in the separately-volumed Postgres) survive — the exact
      # "DB row exists, file missing on disk" 400 seen in production.
      - backend_uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  admin-portal:
    build:
      context: ../admin-portal
      dockerfile: Dockerfile
    container_name: lms_admin
    ports:
      - "80:80"
      - "443:443"
      - "4200:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /opt/lms/admin-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/lms/flutter-web:/usr/share/nginx/flutter-web:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
