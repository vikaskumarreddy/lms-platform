services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lms_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms
      SPRING_DATASOURCE_USERNAME: lms
      SPRING_DATASOURCE_PASSWORD: lms123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://axisoraforge.in}
    volumes:
      # Media/PDF/Doc controllers write to ./uploads/* (relative to the
      # container's /app working dir). Without a persistent volume that
      # directory lives only in the container's writable layer, so every
      # rebuild/redeploy silently wipes every uploaded file while the DB
      # rows (in the separately-volumed Postgres) survive — the exact
      # "DB row exists, file missing on disk" 400 seen in production.
      - backend_uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  admin-portal:
    build:
      context: ../admin-portal
      dockerfile: Dockerfile
    container_name: lms_admin
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
