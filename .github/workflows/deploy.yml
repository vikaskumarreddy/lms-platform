name: Deploy LMS Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend
        working-directory: lms-platform/backend
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Admin Portal
        working-directory: lms-platform/admin-portal
        run: |
          npm install
          npm run build -- --configuration production

      - name: Build Docker Images
        working-directory: lms-platform
        run: |
          docker compose -f docker/docker-compose.yml build

      - name: Run Tests
        working-directory: lms-platform/backend
        run: mvn test
