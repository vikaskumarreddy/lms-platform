server:
  port: 8080

spring:
  mvc:
    cors:
      mappings:
        /api/**:
          allowed-origins:
            - "http://localhost:4200"
            - "http://localhost:3000"
          allowed-methods: "*"
          allowed-headers: "*"
          allow-credentials: true

  datasource:
    url: jdbc:postgresql://postgres:5432/lms
    username: lms
    password: lms123
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        multi_tenancy: DISCRIMINATOR
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: com.institute.lms.util.TenantIdentifierResolverImpl
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis
jwt:
  secret: axisora-forge-academy-secret-key-2024-very-long-secret-key-for-jwt-signing
  expiration: 86400000
  refresh-expiration: 604800000
razorpay:
  key-id: rzp_test_xxx
  key-secret: xxx
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    com.institute.lms: INFO
    org.hibernate.SQL: DEBUG
